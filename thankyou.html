<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感謝您的提交 - GTM 測試頁面</title>



    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #7f8c8d;
        }

        .status-badge {
            background: #27ae60;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 1rem;
        }
    </style>
    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-PTVTJN76');</script>
    <!-- End Google Tag Manager -->
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PTVTJN76" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="container">
        <div class="status-badge">測試流程完成</div>
        <h1>測試表單流程完成</h1>
        <p>這是前端練習頁，沒有將表單資料提交到後端。</p>
        <p id="flow-status">正在檢查本次測試流程…</p>
        <hr>
        <p><small>提示：開啟 GTM 預覽模式，檢查此頁面是否觸發了「網頁瀏覽」或「contact_form_thankyou_arrived」事件。</small></p>
        <a href="index.html">返回首頁測試</a>
    </div>
    <script>
        (function () {
            const key = 'gtm-study:valid-submit:v1';
            const status = document.getElementById('flow-status');
            let marker;
            try {
                const raw = sessionStorage.getItem(key);
                // 先消耗標記，重新整理不重複發出事件。
                sessionStorage.removeItem(key);
                marker = raw ? JSON.parse(raw) : null;
            } catch (_) {
                status.textContent = '無法確認提交來源，本次不記錄提交後到達事件。';
                return;
            }
            const age = marker ? Date.now() - marker.createdAt : NaN;
            if (!marker || typeof marker.createdAt !== 'number' ||
                !Number.isFinite(age) || age < 0 || age >= 5 * 60 * 1000 ||
                marker.destination !== window.location.pathname) {
                status.textContent = '沒有有效的本次提交標記；僅作一般頁面瀏覽。';
                return;
            }
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({ event: 'contact_form_thankyou_arrived' });
            status.textContent = '已確認本次有效提交後到達，並通知 GTM；平台傳送結果請另行驗證。';
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) status.textContent = '返回既有頁面，本次沒有新增到達事件。';
            });
        })();
    </script>
</body>

</html>
